# Le branchement du dépôt sur la chaîne d'agents. La chaîne ne connaît pas
# le jeu : elle lit ce fichier. Afficher la table des rôles :
#
#     python3 -m atelier agents
#
# Ce fichier ne se change qu'en mode direct (AGENTS.md) : un lot n'y touche
# jamais.

[projet]
nom = "Forge"
depot = "PLiagre/Forge"
branche_base = "master"
# Les tests du jeu, depuis la racine du dépôt, tels que la CI les joue, plus
# l'atelier et gitleaks. Le codeur ne joue que ceux de ce qu'il touche : sur
# le VPS, la suite entière dépassait son délai (4 octobre 2026).
tests = "python3 -m pytest jeu -q"
# Ce qu'un lot ne touche jamais. Un changement d'un lot sur ces chemins est
# retiré avant l'enregistrement, et le commentaire de la PR le dit.
interdits = ["atelier/", ".github/", "atelier.toml", "AGENTS.md", "CLAUDE.md", "CAP.md"]
# Un brief prévoit moins que ce nombre de lignes de diff ; sinon le chef
# découpe le lot.
lignes_max = 300
# Passages du codeur après le premier (CI rouge ou relecture « CORRIGER »)
# avant que le lot soit « bloque », avec sa raison. Sur le VPS, le dernier se
# fait par le renfort ([agents]).
corrections_max = 2
# Combien de fois le dépanneur ([agents]) relance un même lot bloqué, avec
# sa consigne, avant de le laisser au propriétaire. Il pose toujours une
# question, ou dit que la chaîne est en cause, quand c'est ce qu'il faut.
depannages_max = 2
dossier_briefs = "docs/briefs"
prefixe_branche = "lot/"

# Une ligne par rôle : harnais/modèle@effort, puis des secours séparés par
# « | ». Harnais : claude (Claude Code), cursor (cursor-agent). L'effort est
# donné à chaque agent : Claude Code le reçoit par `--effort` (low, medium,
# high, xhigh, max) ; Cursor n'a pas d'option, l'effort est dans le nom du
# modèle (`grok-4.7-high` s'écrit `@high`), et `@defaut` dit qu'un modèle
# Cursor n'en propose pas.
#
# Un modèle Claude ne passe que par Claude Code, jamais par Cursor : le
# chargement le refuse (choix du propriétaire, 29 septembre 2026).
# Plus aucun modèle d'OpenAI, par aucun harnais : l'abonnement ChatGPT est
# coupé, Codex est retiré, et GPT ne passe plus par Cursor non plus ; le
# chargement le refuse (choix du propriétaire, 30 octobre 2026).
#
# Trois familles servent : Claude (Claude Code, l'abonnement Claude), grok et
# composer (Cursor). Sur l'abonnement Cursor, ce sont les deux modèles qui
# répondent encore quand le quota des « modèles d'API » (Gemini, Kimi…) est
# épuisé : mesuré le 30 octobre 2026, Gemini et Kimi refusés jusqu'au
# 14 novembre, grok et composer servis.
#
# Un secours ne sert que si le précédent a épuisé son quota, perdu sa
# session, ne démarre pas, refuse l'appel ou a déjà tous ses agents en
# route ; si aucun ne répond, le lot attend, il n'échoue pas.
# Changer de modèle ou d'effort, c'est changer une ligne.
[agents]
# Le chef écrit le brief, dont tout dépend : Claude Opus 5.5 seul, sans
# secours (choix du propriétaire, 30 octobre 2026). Opus à court de quota,
# le lot attend qu'il revienne : aucun autre modèle n'écrit un brief.
chef        = "claude/claude-opus-5-5@high"
# Sonnet code les lots du VPS ; grok en secours.
codeur      = "claude/claude-sonnet-5-5@high | cursor/grok-4.7-high@high"
# Les lots « machine : pc » (Unity, Blender), sur le PC Windows : Claude Opus
# en tête (choix du propriétaire, 29 septembre 2026 : le temps du PC est
# rare, un passage raté y coûte cher), cursor grok en secours.
# `gh workflow run sonde-pc.yml` prouve que chaque agent du PC écrit vraiment.
codeur_3d   = "claude/claude-opus-5-5@high | cursor/grok-4.7-high@high"
# Le dernier passage du codeur d'un lot du VPS avant blocage (la
# 2e correction). La marque reste celle du codeur : le passage compte, et
# la famille qui a écrit (Claude) ne relit pas. Les lots du PC n'ont pas de
# renfort.
renfort     = "claude/claude-sonnet-5-5@high | cursor/grok-4.7-high@high"
# Le modèle qui écrit ne relit jamais : la FAMILLE de modèle qui a écrit le
# lot est écartée, et le suivant de la ligne relit. Quelle que soit la
# famille qui a écrit, il en reste au moins deux agents : un quota ne laisse
# pas un lot sans relecteur (#186 a attendu une cinquantaine de tours le
# 28 septembre ; #825 plus de trois cents le 29 octobre). Trois familles :
# le code de Claude se relit par grok puis composer, celui de grok par
# Claude Opus puis composer.
relecteur   = "claude/claude-opus-5-5@high | cursor/grok-4.7-high@high | cursor/composer-2.5@defaut"
# CI rouge sur master, conflits d'une branche de lot, dépendances : Sonnet
# en effort moyen, travail mécanique ; composer en secours.
mecanicien  = "claude/claude-sonnet-5-5@medium | cursor/composer-2.5@defaut"
# Un lot vient d'être bloqué (essais épuisés, CI rouge, relecture
# « CORRIGER ») : le dépanneur lit tout, en lecture seule, et décide avant le
# propriétaire. Il relance le lot avec une consigne (quota, délai, revue vide,
# codeur qui tourne en rond, relecteur qui exige l'impossible), pose la
# question au propriétaire (le brief contredit un test existant ou la règle
# du monde), ou dit que la chaîne est en cause (mode direct). Diagnostiquer
# demande du jugement : Claude Opus en tête, Sonnet puis grok en secours.
depanneur   = "claude/claude-opus-5-5@high | claude/claude-sonnet-5-5@high | cursor/grok-4.7-high@high"
# Journal du matin, en lecture seule (cursor --mode ask) : grok est le
# modèle qui invente le moins (Artificial Analysis Omniscience).
chroniqueur = "cursor/grok-4.7-high@high"
# Comparaison hebdomadaire avec CAP.md, en lecture seule : un appel par
# semaine, à fort enjeu.
boussole    = "claude/claude-opus-5-5@xhigh | claude/claude-sonnet-5-5@high | cursor/grok-4.7-high@high"

# Combien de lots chaque machine fait avancer en même temps. Le VPS en tient
# plusieurs, chacun dans son worktree, un tour du pilote par lot ; le PC n'a
# qu'un runner. Des lots qui touchent les mêmes fichiers se retrouvent en
# conflit : le mécanicien le résout. Le VPS n'a que deux processeurs : à
# cinq lots, la suite du jeu passait de 14 à 24 minutes, et codeurs comme
# relecteurs dépassaient leur délai (30 septembre 2026). Un lot par
# processeur (choix du propriétaire, 30 septembre 2026).
[machines]
vps = 2
pc = 1

# Combien d'agents d'un même outil tournent ensemble : un abonnement ne se
# vide pas en une heure. Un outil à son plafond passe la main au secours de
# la ligne, comme un quota. Claude a quatre places : chaque lot du VPS code
# avec Sonnet pendant que le chef, le relecteur ou le dépanneur travaillent
# (28 octobre 2026). Si personne n'est libre, le lot
# attend.
[outils]
claude = 4
cursor = 3

# Le temps qu'un agent a pour rendre la main, en secondes.
[delais]
chef = 1800
codeur = 3600
codeur_3d = 3600
renfort = 3600
relecteur = 1800
mecanicien = 3600
# Le dépanneur lit, et rejoue parfois un test rouge : à 1800 s, il a dépassé
# son délai sans rien décider sur #343 et #391 (7 octobre 2026).
depanneur = 3600
chroniqueur = 600
boussole = 1200
