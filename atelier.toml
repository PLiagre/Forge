# Le branchement du dépôt sur la chaîne d'agents. La chaîne ne connaît pas le
# jeu : elle lit ce fichier. Afficher la table des rôles :
#
#     python3 -m atelier agents
#
# Ce fichier ne se change qu'en mode direct : un lot n'y touche jamais.

[projet]
nom = "Forge"
depot = "PLiagre/Forge"
branche_base = "master"
prefixe_branche = "lot/"
# Celui que la chaîne prévient tout de suite, par une mention sur l'issue,
# pour l'irréversible, l'argent et les droits. Rien d'autre ne l'attend.
proprietaire = "PLiagre"
# Ce qu'un lot ne touche jamais : un changement d'un lot sur ces chemins est
# retiré avant l'enregistrement, et le commentaire de la PR le dit.
interdits = ["atelier/", ".github/", "atelier.toml", "AGENTS.md", "CLAUDE.md", "CAP.md"]
# Le cœur du moteur : un lot qui touche un de ces chemins est relu par le CTO.
coeur = ["jeu/sim/engine.py", "jeu/sim/world.py", "jeu/sim/intentions.py"]
# Les pistes d'un palier : l'étiquette que porte chaque lot.
pistes = ["monde", "ville", "interface"]
# Corrections après une CI rouge ou une relecture « CORRIGER » avant que le
# lot soit bloqué et que le CTO le regarde.
corrections_max = 2
# Coupures de suite par son délai avant qu'un lot soit bloqué.
coupures_max = 3
# Fois où le CTO relance un même lot bloqué avant de le redécouper ou de le
# laisser au propriétaire.
deblocages_max = 2

# Une ligne par rôle : harnais/modèle@effort. Changer un rôle de modèle,
# c'est changer sa ligne. Le harnais est Claude Code ; l'effort est celui de
# `--effort` (low, medium, high, xhigh, max). Quand le quota manque, le lot
# attend : il n'échoue pas.
[agents]
# Le samedi, il tire les lots du palier. En semaine, il tranche, débloque,
# redécoupe, relit le cœur du moteur, et écrit la note du vendredi. Il ne
# code pas : il est appelé en lecture seule.
cto         = "claude/claude-fable-5-2@high"
# Il conçoit le lot, écrit son plan, code le difficile et confie le reste,
# dans une seule session reprise jusqu'à la fusion.
chef        = "claude/claude-opus-5-5@high"
# Les tâches bornées que le chef lui confie, dans la session du chef ; et les
# lots simples, qu'il mène seul.
developpeur = "claude/claude-sonnet-5-5@high"
# Une autre session que celle du chef, en lecture seule.
relecteur   = "claude/claude-opus-5-5@high"
# Il résume un journal de CI et écrit le journal du matin. Il ne juge jamais.
lecteur     = "claude/claude-haiku-5-5@medium"

# Combien de lots chaque machine fait avancer en même temps. Le VPS n'a que
# deux processeurs ; le PC n'a qu'un Unity.
[machines]
vps = 2
pc = 1

# Combien d'agents tournent ensemble sur l'abonnement.
[outils]
claude = 4

# Le temps qu'un appel a pour rendre la main, en secondes. Un appel coupé
# n'est pas perdu : sa session reprend au tour suivant.
[delais]
cto = 1800
chef = 3600
developpeur = 3600
relecteur = 1800
lecteur = 600

# Ce qu'un agent n'a pas le droit de lancer pendant un lot : la suite entière
# du jeu, et une simulation plus longue que ce nombre de jours. La CI joue la
# suite ; la nuit joue les longues preuves.
[gardes]
jours_max = 400
