# Le branchement du dépôt sur la chaîne d'agents. La chaîne ne connaît pas
# le jeu : elle lit ce fichier. Afficher la table des rôles :
#
#     python3 -m atelier agents
#
# Ce fichier ne se change qu'en mode direct (AGENTS.md) : un lot n'y touche
# jamais.

[projet]
nom = "Forge"
depot = "PLiagre/Forge"
branche_base = "master"
# Les tests du jeu, depuis la racine du dépôt. Ce que le codeur joue avant de
# rendre la main ; la CI joue les mêmes, plus l'atelier et gitleaks.
tests = "python3 -m pytest jeu -q"
# Ce qu'un lot ne touche jamais. Un changement d'un lot sur ces chemins est
# retiré avant l'enregistrement, et le commentaire de la PR le dit.
interdits = ["atelier/", ".github/", "atelier.toml", "AGENTS.md", "CLAUDE.md", "CAP.md"]
# Un brief prévoit moins que ce nombre de lignes de diff ; sinon le chef
# découpe le lot.
lignes_max = 300
# Passages du codeur après le premier (CI rouge ou relecture « CORRIGER »)
# avant que le lot soit « bloque », avec sa raison.
corrections_max = 2
dossier_briefs = "docs/briefs"
prefixe_branche = "lot/"

# Une ligne par rôle : outil/modèle, puis des secours séparés par « | ».
# Outils : claude (Claude Code), codex (Codex CLI), cursor (cursor-agent).
# Un secours ne sert que si le précédent a épuisé son quota ou perdu sa
# session ; si aucun ne répond, le lot attend, il n'échoue pas.
# Changer de modèle, c'est changer une ligne.
[agents]
# Un quota de Claude Code ne retient pas le chef : le même modèle, par Cursor.
chef        = "claude/claude-opus-5-5 | cursor/claude-opus-5-5-high"
codeur      = "codex/gpt-5.6-sol | cursor/grok-4.7-high"
# Les lots « machine : pc » (Unity, Blender), sur le PC Windows.
codeur_3d   = "claude/claude-opus-5-5 | cursor/claude-opus-5-5-high"
# Le modèle qui écrit ne relit jamais : la FAMILLE de modèle qui a écrit le
# lot est écartée, quel que soit l'outil (cursor/claude-opus est de la
# famille claude), et le suivant de la ligne relit (codex quand l'auteur est
# un Claude).
relecteur   = "claude/claude-opus-5-5 | codex/gpt-5.6-sol"
# CI rouge sur master, conflits d'une branche de lot, dépendances.
mecanicien  = "cursor/composer-2.5"
# Journal du matin, en lecture seule (cursor --mode ask).
chroniqueur = "cursor/grok-4.7-high"
# Comparaison hebdomadaire avec CAP.md, en lecture seule.
boussole    = "claude/claude-opus-5-5 | cursor/claude-opus-5-5-high"

# Le temps qu'un agent a pour rendre la main, en secondes.
[delais]
chef = 1800
codeur = 3600
codeur_3d = 3600
relecteur = 1800
mecanicien = 1800
chroniqueur = 600
boussole = 1200
