# Le branchement du dépôt sur la chaîne d'agents. La chaîne ne connaît pas
# le jeu : elle lit ce fichier. Afficher la table des rôles :
#
#     python3 -m atelier agents
#
# Ce fichier ne se change qu'en mode direct (AGENTS.md) : un lot n'y touche
# jamais.

[projet]
nom = "Forge"
depot = "PLiagre/Forge"
branche_base = "master"
# Les tests du jeu, depuis la racine du dépôt. Ce que le codeur joue avant de
# rendre la main ; la CI joue les mêmes, plus l'atelier et gitleaks.
tests = "python3 -m pytest jeu -q"
# Ce qu'un lot ne touche jamais. Un changement d'un lot sur ces chemins est
# retiré avant l'enregistrement, et le commentaire de la PR le dit.
interdits = ["atelier/", ".github/", "atelier.toml", "AGENTS.md", "CLAUDE.md", "CAP.md"]
# Un brief prévoit moins que ce nombre de lignes de diff ; sinon le chef
# découpe le lot.
lignes_max = 300
# Passages du codeur après le premier (CI rouge ou relecture « CORRIGER »)
# avant que le lot soit « bloque », avec sa raison.
corrections_max = 2
dossier_briefs = "docs/briefs"
prefixe_branche = "lot/"

# Une ligne par rôle : outil/modèle, puis des secours séparés par « | ».
# Outils : claude (Claude Code), codex (Codex CLI), cursor (cursor-agent).
# Un secours ne sert que si le précédent a épuisé son quota ou perdu sa
# session ; si aucun ne répond, le lot attend, il n'échoue pas.
# Changer de modèle, c'est changer une ligne.
[agents]
# Claude Opus juge, les autres écrivent : le plafond de Claude Code, atteint
# le 29 septembre 2026, se garde pour la relecture.
#
# Le chef reste Claude Opus, porté d'abord par Cursor (un autre abonnement) ;
# Claude Code le reprend quand Cursor ne répond pas.
chef        = "cursor/claude-opus-5-5-high | claude/claude-opus-5-5"
codeur      = "codex/gpt-5.6-sol | cursor/grok-4.7-high"
# Les lots « machine : pc » (Unity, Blender), sur le PC Windows : cursor grok,
# Claude en secours. Pas codex : son bac à sable Windows ne démarre pas
# (« timed out connecting runner pipe-in », lot #120, 29 septembre 2026) ;
# il répond, mais n'écrit rien. `gh workflow run sonde-pc.yml` prouve que
# chaque agent du PC écrit vraiment.
codeur_3d   = "cursor/grok-4.7-high | claude/claude-opus-5-5"
# Le modèle qui écrit ne relit jamais : la FAMILLE de modèle qui a écrit le
# lot est écartée, quel que soit l'outil (cursor/claude-opus est de la
# famille claude), et le suivant de la ligne relit. Quelle que soit la
# famille qui a écrit, il en reste au moins deux agents : un quota ne laisse
# pas un lot sans relecteur (#186 a attendu une cinquantaine de tours le
# 28 septembre, Claude écarté et codex à court de quota).
relecteur   = "claude/claude-opus-5-5 | cursor/claude-opus-5-5-high | codex/gpt-5.6-sol | cursor/grok-4.7-high"
# CI rouge sur master, conflits d'une branche de lot, dépendances.
mecanicien  = "cursor/composer-2.5"
# Journal du matin, en lecture seule (cursor --mode ask).
chroniqueur = "cursor/grok-4.7-high"
# Comparaison hebdomadaire avec CAP.md, en lecture seule.
boussole    = "claude/claude-opus-5-5 | cursor/claude-opus-5-5-high"

# Combien de lots chaque machine fait avancer en même temps. Le VPS en tient
# plusieurs, chacun dans son worktree, un tour du pilote par lot ; le PC n'a
# qu'un runner. Des lots qui touchent les mêmes fichiers se retrouvent en
# conflit : le mécanicien le résout.
[machines]
vps = 3
pc = 1

# Combien d'agents d'un même outil tournent ensemble : un abonnement ne se
# vide pas en une heure. Un outil à son plafond passe la main au secours de
# la ligne, comme un quota : le troisième lot du VPS code avec cursor grok
# pendant que codex en tient deux. Si personne n'est libre, le lot attend.
[outils]
claude = 2
codex = 2
cursor = 3

# Le temps qu'un agent a pour rendre la main, en secondes.
[delais]
chef = 1800
codeur = 3600
codeur_3d = 3600
relecteur = 1800
mecanicien = 1800
chroniqueur = 600
boussole = 1200
