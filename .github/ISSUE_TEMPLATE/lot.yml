name: Demander un lot
description: L'avancée d'une piste pour un palier, écrite comme une fiche.
title: ""
labels: ["lot", "pret"]
body:
  - type: markdown
    attributes:
      value: |
        Un lot est l'avancée d'une piste pour un palier
        ([CAP.md](../blob/master/CAP.md)). Le samedi, c'est le CTO qui écrit
        les fiches ; ce formulaire sert à en ajouter une à la main.

        Après l'avoir créée, range l'issue dans le jalon de son palier
        (« Palier n — … ») et pose ses étiquettes : sa piste (`monde`,
        `ville` ou `interface`), `pc` si elle demande Unity ou Blender,
        `simple` si le développeur peut la mener seul. La chaîne prend les
        lots `pret` du palier en cours, au plus petit numéro d'abord.
  - type: textarea
    id: joueur
    attributes:
      label: Ce que je joue de plus
      description: Le geste, et ce qu'il décide.
    validations:
      required: true
  - type: textarea
    id: samedi
    attributes:
      label: Ce que je vois samedi
      description: L'écran, en mots de joueur.
    validations:
      required: true
  - type: textarea
    id: regle
    attributes:
      label: La règle du monde
      description: Comment ça marche, son niveau de fidélité, la section de jeu/sim/MODELE.md qui change. « sans objet » pour un écran.
    validations:
      required: true
  - type: textarea
    id: preuves
    attributes:
      label: Les preuves
      description: Des commandes qui peuvent échouer, et, pour un écran, la capture qu'on regarde.
  - type: input
    id: depend
    attributes:
      label: Dépend de
      description: Les issues qui doivent être livrées avant celle-ci (« #12, #13 »). Vide si elle n'attend personne.
      placeholder: "#12, #13"
