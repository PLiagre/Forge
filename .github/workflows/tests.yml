name: tests

# Le jeu (moteur, vues, commande de bout en bout) et la chaîne qui le fait
# avancer (l'atelier). Cette CI ne juge pas un lot et ne fusionne rien : elle
# dit si les contrôles passent. La protection de master n'exige que deux
# noms : `tests` (le travail qui agrège tous ceux d'ici) et `gitleaks`.

on:
  push:
    branches: [master]
  pull_request:
  # Pour rejouer à la main, ou depuis le pilote.
  workflow_dispatch:

permissions:
  contents: read

# GitHub pose `CI=true`. pytest y répond en comparant deux structures
# inégales en entier (pformat puis difflib.ndiff, quadratique), même dans un
# `pytest.raises(AssertionError)` où personne ne lit le diff : le moteur en a
# plus de 200, ses contre-épreuves. Le 11 octobre 2026,
# test_maitre_permutations prenait 6 s sur le PC et 63 min ici, et un vrai
# rouge sur un monde entier pouvait tourner des heures (#573). Vide, la
# variable laisse pytest faire comme sur le PC (atelier/tests/test_ci.py).
env:
  CI: ""

# Une révision remplacée ne garde pas ses runners : quand une PR reçoit un
# nouveau commit, le passage de l'ancien s'arrête. Le 11 octobre 2026, une
# tranche de #573 a tourné 6 h sur une révision que le mécanicien avait déjà
# remplacée. Master et les lancements à la main ont chacun leur groupe : ils
# ne s'annulent jamais.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-pr-{0}', github.event.pull_request.number) || format('tests-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  sim:
    # Le moteur. Bibliothèque standard seule : s'il lui fallait une roue,
    # ce ne serait plus un moteur qui tourne sur une machine nue (pytest et
    # pytest-xdist ne servent qu'à le tester).
    # Le 9 octobre 2026, ses 987 tests prenaient 3 h 20 sur un seul cœur, et
    # chaque PR attendait ce temps : ils se jouent en tranches, partagées
    # d'après les durées mesurées (jeu/sim/tests/tranches.py), chacune sur
    # les cœurs de son runner. Toutes les tranches vertes, et `tests` peut
    # l'être. Chaque tranche garde ses durées en artefact, pour remettre
    # `durees.json` à jour.
    # Les tests qui comptent des millisecondes (`chronometre`) n'y sont pas :
    # ils ont leur travail, plus bas, car quatre processus sur quatre cœurs
    # leur font dépasser le budget d'un tick.
    # Une tranche qui ne finit pas (un test qui boucle) s'arrête au bout de
    # 3 h, pas des 6 h de GitHub : la plus lente de master en prend 1 h 40
    # (11 octobre 2026). Arrêtée, elle compte rouge pour `tests`.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        tranche: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pytest-xdist
      - name: Les tests du moteur, tranche ${{ matrix.tranche }} sur 3
        run: python -m pytest sim/tests/ -q -n auto --dist worksteal -m "not chronometre"
        working-directory: jeu
        env:
          FORGE_TRANCHE: ${{ matrix.tranche }}/3
          FORGE_DUREES: durees-${{ matrix.tranche }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: durees-${{ matrix.tranche }}
          path: jeu/durees-${{ matrix.tranche }}.json
          retention-days: 30

  chronometre:
    # Les tests du moteur qui comparent un temps réel à un budget (jeu/sim/tests,
    # marque `chronometre`) : seuls sur leur runner, un à un, sans -n et sans
    # tranche, comme avant que les tranches existent. Les options passent avant
    # le dossier : cette ligne n'est pas une étape « dossier de tests » pour
    # atelier/tests/test_ci.py, la tranche de `sim` l'est déjà.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Les tests du moteur qui chronomètrent
        run: python -m pytest -m chronometre sim/tests/ -q
        working-directory: jeu

  vues:
    # Les trois vues sur la même photographie : le tableau de bord, la
    # chronique et la carte. Aucune n'a besoin de GPU — la rasterisation et
    # le coloriage sont du calcul. Le rendu forge3d lui-même n'est pas
    # installé ici : un contrôle qui exigerait une carte graphique ne
    # tournerait pas, et un contrôle qui ne tourne pas ne protège rien.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest numpy pillow
      - name: Le tableau de bord
        run: python -m pytest vues/tableau/tests/ -q
        working-directory: jeu
      - name: La chronique
        run: python -m pytest vues/chronique/tests/ -q
        working-directory: jeu
      - name: La carte de statistique
        run: python -m pytest vues/relief/tests/ -q
        working-directory: jeu

  forge:
    # La porte de la V1, jouée pour de vrai : une commande simule,
    # photographie et rend les trois vues. Elle ne vérifie pas des unités —
    # elle vérifie que le tout marche ensemble, ce qu'aucun test unitaire ne
    # peut dire. Les artefacts sont conservés : une carte qu'on ne peut pas
    # regarder ne prouve pas grand-chose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest numpy pillow
      - name: Les contrôles de la commande
        run: python -m pytest forge/tests/ -q
        working-directory: jeu
      - name: Les autres tests du jeu
        # Le contrat ville (jeu/ville/tests, lot #118), et tout dossier de
        # tests qu'un lot ajoute ailleurs que dans ceux joués plus haut : un
        # lot ne touche pas .github/, et un test que la CI ne joue pas ne
        # protège rien (atelier/tests/test_ci.py le vérifie). Les --ignore
        # sont exactement les dossiers des étapes ci-dessus. Code 5 : aucun
        # test trouvé, ce n'est pas un échec.
        working-directory: jeu
        run: |
          code=0
          python -m pytest . -q --ignore=sim/tests --ignore=vues/tableau/tests --ignore=vues/chronique/tests \
            --ignore=vues/relief/tests --ignore=forge/tests || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi
      - name: Lancer une simulation et l'afficher
        run: python -m forge --ticks 60 --seed 0 --pas 20 --sortie sortie
        working-directory: jeu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v1-sortie
          path: jeu/sortie/
          retention-days: 7

  atelier:
    # La chaîne : son Python (atelier/) sur un GitHub en mémoire et des agents
    # dictés — aucun quota n'est dépensé ici — et son harnais shell, lu par
    # shellcheck (déjà sur l'image du runner).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Le harnais est lisible par shellcheck
        run: shellcheck -x -s bash ./*.sh atelier-boucle profils/*.sh
        working-directory: atelier/crons
      - name: Les tests de l'atelier
        run: python -m pytest atelier/tests -q

  tests:
    # Le seul nom que la protection de master exige, avec `gitleaks`. Il est
    # vert si et seulement si chacun des travaux ci-dessus l'est : un travail
    # ajouté ou retiré ici ne demande aucun réglage GitHub, et un travail
    # sauté ou annulé retient comme un rouge. Aucune logique de shell : la
    # condition est une expression GitHub (règle 13).
    if: always()
    needs: [sim, chronometre, vues, forge, atelier]
    runs-on: ubuntu-latest
    steps:
      - name: Un travail n'est pas vert
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Tous les travaux sont verts
        run: echo "sim, chronometre, vues, forge et atelier sont verts"
