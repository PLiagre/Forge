name: lot-pc

# Un lot « machine : pc » (Unity, Blender), travaillé sur le PC du propriétaire.
#
# Le pilote du VPS le lance par `workflow_dispatch`, jamais par `pull_request` :
# le dépôt est public, et une fourche ne doit rien lancer sur le PC. Le runner
# `pc-forge` tourne sous la session Windows du propriétaire : c'est là que
# vivent Claude Code, la licence Unity et les packs de l'Asset Store.
#
# Tout se passe dans des worktrees de D:\Forge, ignorés par git :
#   .atelier\pilote-pc       le code de la chaîne, sur master
#   .atelier\chantiers\pc    le lot, sur sa branche ; sa Library Unity reste
#                            chaude d'un lot à l'autre
#   .atelier\journal         la branche des captures
#
# Le travail ne part que quand le PC est allumé : GitHub le garde en file un
# jour, puis le pilote le renvoie. Pas de groupe de concurrence : il
# n'admet qu'un travail en attente, et le build de la nuit en file pendant
# que le PC dort annulait l'envoi d'un lot. Le runner unique enchaîne déjà
# les travaux un par un.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "l'issue du lot"
        required: true
      branche:
        description: "la branche du lot"
        required: true
      pr:
        description: "la PR du lot"
        required: true
      essai:
        description: "le passage du codeur (0 = premier)"
        required: false
        default: "0"
      action:
        description: "coder, corriger_ci ou corriger_relecture"
        required: false
        default: "coder"

permissions:
  contents: read

jobs:
  lot:
    runs-on: [self-hosted, Windows, unity]
    timeout-minutes: 180
    steps:
      - name: Le lot, dans le worktree de D:\Forge
        shell: powershell
        env:
          ISSUE: ${{ inputs.issue }}
          BRANCHE: ${{ inputs.branche }}
          PR: ${{ inputs.pr }}
          ESSAI: ${{ inputs.essai }}
          ACTION: ${{ inputs.action }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Le service ne voit pas le PATH de la session : on y remet les agents
          # (claude, cursor-agent). Les .cmd ne se lancent pas
          # tels quels : `atelier.agents.lancement` appelle leur node.exe.
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:APPDATA\npm;$env:LOCALAPPDATA\cursor-agent;$env:PATH"
          git -C D:\Forge fetch --quiet --prune origin
          $atelier = 'D:\Forge\.atelier\pilote-pc'
          if (-not (Test-Path "$atelier\.git")) { git -C D:\Forge worktree add --force --detach $atelier origin/master }
          git -C $atelier checkout --quiet --force --detach origin/master
          $env:PYTHONPATH = $atelier
          py -m atelier --projet $atelier pc --depot-local D:\Forge --issue $env:ISSUE --branche $env:BRANCHE `
            --pr $env:PR --essai $env:ESSAI --action $env:ACTION --vendor D:\Forge\3d\unity\Assets\Vendor

  # Un passage qui tombe hors de Python (runner coupé, PC en veille, processus
  # tué, PowerShell qui casse avant `atelier pc`) ne laisse aucune marque : le
  # pilote attendait 24 h avant de renvoyer. Ce travail répond à sa place par
  # une attente, renvoyée dans l'heure ; un envoi qui a déjà sa réponse la
  # garde. Un travail à part, pas une étape de `lot` : le 16 octobre 2026
  # (run 38864468926), le runner avait perdu GitHub, et une étape de `lot`
  # n'aurait jamais tourné. Celui-ci attend en file le retour du runner.
  # Pas de GITHUB_TOKEN (il ne lit que le code) : le `gh` de la session du
  # propriétaire, comme `atelier pc`.
  repondre:
    needs: lot
    if: ${{ always() && needs.lot.result != 'success' }}
    runs-on: [self-hosted, Windows, unity]
    timeout-minutes: 10
    steps:
      - name: L'attente, sur la PR du lot
        shell: powershell
        # La raison passe par l'environnement : PowerShell 5.1 peut lire le
        # script en ANSI, et abîmer ses accents.
        env:
          PR: ${{ inputs.pr }}
          RAISON: "le passage du PC est tombé sans répondre (travail `lot` : ${{ needs.lot.result }}, ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        run: |
          $ErrorActionPreference = 'Stop'
          # Le code de la chaîne tel que `lot` l'a laissé : pas de fetch, il a
          # peut-être cassé là.
          $atelier = 'D:\Forge\.atelier\pilote-pc'
          $env:PYTHONPATH = $atelier
          py -m atelier --projet $atelier marquer-attente --pr $env:PR --raison $env:RAISON
