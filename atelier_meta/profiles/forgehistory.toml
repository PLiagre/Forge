# Branchement ForgeHistory — copier à la racine du dépôt produit.

[projet]
nom = "ForgeHistory"
briefs = "briefs"
tests = "python3 -m pytest sim/tests/ viewer/tests/ -q"
fumee = "python3 -m sim --ticks 0 --json"
